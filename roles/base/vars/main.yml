---
# Software installation catalog filter_plugins/catalog.py.
#
# An entry is present on every profile unless `profiles` is defined. The
# three states are present, absent and ignore:
#
#   - { name: htop }                                   present everywhere
#   - { name: slack, profiles: { personal: absent } }   work only, removed from personal
#   - { name: steam, profiles: { work: ignore } }       personal only, work ignored
#   - { name: firefox, profiles: { personal: absent, work: absent } }
#                                                      removed on both profiles
#   - { name: cache, user_data: true }                 removed only with -e remove_user_data=true

protonvpn_version: 1.0.8

base_apt_repos:
  - name: keepassxc
    uris: "https://ppa.launchpadcontent.net/phoerious/keepassxc/ubuntu"
    suites: ["{{ ansible_distribution_release }}"]
    components: [main]
    architectures: [amd64]
    signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xD89C66D0E31FEA2874EBD20561922AB60068FCD6&options=mr"

base_debs:
  - name: protonvpn-release
    package: protonvpn-stable-release
    url: "https://repo.protonvpn.com/debian/dists/stable/main/binary-all/protonvpn-stable-release_{{ protonvpn_version }}_all.deb"

base_apt_packages: # Keep in alphabetical order
  - { name: arc-theme }
  - { name: apt-transport-https }
  - { name: ca-certificates }
  - { name: curl }
  - { name: dropbox }
  - { name: gir1.2-ayatanaappindicator3-0.1 }
  - { name: git }
  - { name: gnome-tweaks }
  - { name: gnome-shell-extension-appindicator }
  - { name: gnome-shell-extension-manager }
  - { name: gnupg }
  - { name: htop }
  - { name: keepassxc }
  - { name: libayatana-appindicator3-1 }
  - { name: proton-vpn-gnome-desktop }
  - { name: python3-pip }
  - { name: python3-kubernetes }
  - { name: ripgrep }
  - { name: software-properties-common }
  - { name: stow }
  - { name: terminator }
  - { name: x11-utils }

base_snaps: # Keep in alphabetical order
  - { name: chromium, classic: false }
  - { name: firefox, classic: false, profiles: { personal: absent, work: absent } } # ships with Ubuntu
  - { name: go, classic: true }

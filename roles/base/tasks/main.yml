---
- name: Add apt repositories
  become: true
  become_user: root
  become_method: sudo
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    uris: "{{ item.uris }}"
    suites: "{{ item.suites }}"
    components: "{{ item.components | default(omit) }}"
    architectures: "{{ item.architectures | default(omit) }}"
    signed_by: "{{ item.signed_by }}"
    state: present
    install_python_debian: true
  loop: "{{ base_apt_repos_selected }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install base packages
  become: true
  become_user: root
  become_method: sudo
  ansible.builtin.apt:
    name: "{{ base_apt_packages_selected | map(attribute='name') | list }}"
    state: present
    update_cache: true
  when: base_apt_packages_selected | length > 0

- name: Install base snaps
  community.general.snap:
    name: "{{ base_snaps_selected | rejectattr('classic') | map(attribute='name') | list }}"
    state: present
  when: base_snaps_selected | rejectattr('classic') | list | length > 0

- name: Install base snaps with classic confinement
  become: true
  become_user: root
  become_method: sudo
  community.general.snap:
    name: "{{ base_snaps_selected | selectattr('classic') | map(attribute='name') | list }}"
    state: present
    classic: true
  when: base_snaps_selected | selectattr('classic') | list | length > 0

- name: Generate SSH key
  openssh_keypair:
    path: "{{ home_dir }}/.ssh/id_rsa"
    size: 2048
    owner: "{{ local_user }}"

- name: Add GitHub to known hosts
  ansible.builtin.known_hosts:
    path: /etc/ssh/ssh_known_hosts
    name: github.com
    key: "{{ lookup('pipe', 'ssh-keyscan -t rsa github.com') }}"
    state: present

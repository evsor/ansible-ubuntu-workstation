---
- name: Install .deb packages
  become: true
  become_user: root
  become_method: sudo
  ansible.builtin.apt:
    deb: "{{ item.url }}"
  loop: "{{ misc_debs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install additional packages
  become: true
  become_user: root
  become_method: sudo
  ansible.builtin.apt:
    name: "{{ misc_apt_packages | map(attribute='name') | list }}"
    state: present
    update_cache: true

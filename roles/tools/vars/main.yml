---
keyrings_dir: "/etc/apt/keyrings"
kubectl_version: 1.34
kubeswitch_version: 0.9.3
k9s_version: 0.50.16
sops_version: 3.11.0
yq_version: 4.48.1
fzf_version: 0.66.1
qbec_version: 0.16.3
jb_version: 0.6.0
argocd_version: 3.1.9
mongodb_version: 8.0
kubetlkt_version: 0.5
cmctl_version: 2.3.0
k3d_version: 5.8.3
cilium_version: 0.18.8
kubeseal_version: 0.33.1

# Software installation catalog
#
# profiles: where the tool gets installed
# files:    every path a tarball extracts, verified against the actual release artifact. Needed to proper cleanup
# package:  for removal by name

# Repositories are written as deb822 .sources files, each with its own
# Signed-By key. apt_key and the trusted.gpg keyring it writes to are
# deprecated, and a key landing there signs for every repository on the system;
# deb822_repository instead stores each signed_by key in its own keyring under
# keyrings_dir and scopes it to that one repository.
#
# suites: a suite ending in "/" addresses an exact path and takes no components
tools_apt_repos:
  - name: vscode
    uris: "https://packages.microsoft.com/repos/code"
    suites: [stable]
    components: [main]
    architectures: [amd64, arm64, armhf]
    signed_by: "https://packages.microsoft.com/keys/microsoft.asc"
    profiles: [personal, work]

  - name: kubernetes
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ kubectl_version }}/deb/"
    suites: ["/"]
    architectures: [amd64, arm64, armhf]
    signed_by: "https://pkgs.k8s.io/core:/stable:/v{{ kubectl_version }}/deb/Release.key"
    profiles: [personal, work]

  - name: docker
    uris: "https://download.docker.com/linux/ubuntu"
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: [amd64]
    signed_by: "https://download.docker.com/linux/ubuntu/gpg"
    profiles: [personal, work]

  - name: google-cloud
    uris: "https://packages.cloud.google.com/apt"
    suites: [cloud-sdk]
    components: [main]
    signed_by: "https://packages.cloud.google.com/apt/doc/apt-key.gpg"
    profiles: [personal, work]

  - name: openvpn
    uris: "https://packages.openvpn.net/openvpn3/debian"
    suites: ["{{ ansible_distribution_release }}"]
    components: [main]
    signed_by: "https://packages.openvpn.net/packages-repo.gpg"
    profiles: [personal, work]

  - name: hashicorp
    uris: "https://apt.releases.hashicorp.com"
    suites: ["{{ ansible_distribution_release }}"]
    components: [main]
    signed_by: "https://apt.releases.hashicorp.com/gpg"
    profiles: [personal, work]

  - name: helm
    uris: "https://packages.buildkite.com/helm-linux/helm-debian/any/"
    suites: [any]
    components: [main]
    architectures: [amd64]
    signed_by: "https://packages.buildkite.com/helm-linux/helm-debian/gpgkey"
    profiles: [personal, work]

  - name: mongodb
    uris: "https://repo.mongodb.org/apt/ubuntu"
    suites: ["{{ ansible_distribution_release }}/mongodb-org/{{ mongodb_version }}"]
    components: [multiverse]
    architectures: [amd64]
    signed_by: "https://www.mongodb.org/static/pgp/server-{{ mongodb_version }}.asc"
    profiles: [personal, work]

# Written by the previous apt_repository tasks and superseded by the .sources
# files above. Removed so apt does not read the same repository twice; the
# kubernetes glob also catches entries left by earlier kubectl_version values.
tools_apt_legacy_sources:
  - "packages_microsoft_com_repos_code.list"
  - "pkgs_k8s_io_core_stable_*.list"
  - "docker.list"
  - "packages_cloud_google_com_apt.list"
  - "packages_openvpn_net_openvpn3_debian.list"
  - "apt_releases_hashicorp_com.list"
  - "packages_buildkite_com_helm_linux_helm_debian_any.list"
  - "repo_mongodb_org_apt_ubuntu.list"

# Keys the old tasks downloaded under names that no longer match a repository.
# deb822_repository names each keyring after its repo, so these two are orphaned
# by the rename (microsoft -> vscode, cloud.google -> google-cloud).
tools_apt_legacy_keyrings:
  - "microsoft.asc"
  - "cloud.google.asc"

tools_apt_packages: # Keep in alphabetical order
  - { name: code, profiles: [personal, work] }
  - { name: containerd.io, profiles: [personal, work] }
  - { name: docker-ce, profiles: [personal, work] }
  - { name: docker-ce-cli, profiles: [personal, work] }
  - { name: docker-buildx-plugin, profiles: [personal, work] }
  - { name: docker-compose-plugin, profiles: [personal, work] }
  - { name: google-cloud-cli, profiles: [personal, work] }
  - { name: google-cloud-sdk-gke-gcloud-auth-plugin, profiles: [personal, work] }
  - { name: helm, profiles: [personal, work] }
  - { name: kubectl, profiles: [personal, work] }
  - { name: mongodb-mongosh, profiles: [personal, work] }
  - { name: openvpn3, profiles: [personal, work] }
  - { name: skopeo, profiles: [personal, work] }
  - { name: terraform, profiles: [personal, work] }
  - { name: vault, profiles: [personal, work] }

tools_binaries:
  - name: switcher
    url: "https://github.com/danielfoehrKn/kubeswitch/releases/download/{{ kubeswitch_version }}/switcher_linux_amd64"
    dest: /usr/local/bin/switcher
    profiles: [personal, work]

  - name: sops
    url: "https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-v{{ sops_version }}.linux.amd64"
    dest: /usr/local/bin/sops
    profiles: [personal, work]

  - name: yq
    url: "https://github.com/mikefarah/yq/releases/download/v{{ yq_version }}/yq_linux_amd64"
    dest: /usr/local/bin/yq
    profiles: [personal, work]

  - name: jb
    url: "https://github.com/jsonnet-bundler/jsonnet-bundler/releases/download/v{{ jb_version }}/jb-linux-amd64"
    dest: /usr/local/bin/jb
    profiles: [personal, work]

  - name: argocd
    url: "https://github.com/argoproj/argo-cd/releases/download/v{{ argocd_version }}/argocd-linux-amd64"
    dest: /usr/local/bin/argocd
    profiles: [personal, work]

  - name: minikube
    url: "https://github.com/kubernetes/minikube/releases/latest/download/minikube-linux-amd64"
    dest: /usr/local/bin/minikube
    profiles: [personal, work]

  - name: k3d
    url: "https://github.com/k3d-io/k3d/releases/download/v{{ k3d_version }}/k3d-linux-amd64"
    dest: /usr/local/bin/k3d
    profiles: [personal, work]

tools_tarballs:
  - name: fzf
    url: "https://github.com/junegunn/fzf/releases/download/v{{ fzf_version }}/fzf-{{ fzf_version }}-linux_amd64.tar.gz"
    dest: /usr/local/bin/
    files: [fzf]
    profiles: [personal, work]

  - name: qbec
    url: "https://github.com/splunk/qbec/releases/download/v{{ qbec_version }}/qbec-linux-amd64.tar.gz"
    dest: /usr/local/bin/
    files: [qbec, jsonnet-qbec, CHANGELOG.md, LICENSE, README.md, licenselint.sh]
    profiles: [personal, work]

  - name: kubetlkt
    url: "https://github.com/evsor/kubetoolkit/releases/download/v{{ kubetlkt_version }}/kubetlkt-v{{ kubetlkt_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin/
    files: [kubetlkt]
    profiles: [personal, work]

  - name: cmctl
    url: "https://github.com/cert-manager/cmctl/releases/download/v{{ cmctl_version }}/cmctl_linux_amd64.tar.gz"
    dest: /usr/local/bin/
    files: [cmctl, LICENSE, README.md]
    profiles: [personal, work]

  - name: cilium
    url: "https://github.com/cilium/cilium-cli/releases/download/v{{ cilium_version }}/cilium-linux-amd64.tar.gz"
    dest: /usr/local/bin/
    files: [cilium]
    profiles: [personal, work]

  - name: kubeseal
    url: "https://github.com/bitnami-labs/sealed-secrets/releases/download/v{{ kubeseal_version }}/kubeseal-{{ kubeseal_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin/
    files: [kubeseal, LICENSE, README.md]
    profiles: [personal, work]

tools_debs:
  - name: k9s
    package: k9s
    url: "https://github.com/derailed/k9s/releases/download/v{{ k9s_version }}/k9s_linux_amd64.deb"
    profiles: [personal, work]

# user_data: do not remove user data directories
tools_directories:
  - path: "{{ home_dir }}/.terraform.d/plugin-cache"
    user_data: true
    profiles: [personal, work]

tools_helm_repos:
  - name: hashicorp
    url: "https://helm.releases.hashicorp.com"
    profiles: [personal, work]

tools_helm_plugins:
  - name: helm-diff
    url: https://github.com/databus23/helm-diff
    profiles: [personal, work]

# Supplementary groups the local user is added to.
tools_user_groups:
  - name: docker
    profiles: [personal, work]

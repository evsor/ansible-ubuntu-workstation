---
- name: Install dotfiles
  when: workstation.state == 'present'
  block:
    - name: Clone dotfiles repo
      ansible.builtin.git:
        repo: 'git@github.com:evsor/.dotfiles.git'
        dest: "{{ home_dir }}/.dotfiles"
        key_file: "{{ home_dir }}/.ssh/id_rsa"

    - name: Change owner
      ansible.builtin.file:
        path: "{{ home_dir }}/.dotfiles"
        owner: "{{ local_user }}"
        group: "{{ local_user }}"
        recurse: true

    - name: Get existing .bashrc
      ansible.builtin.stat:
        path: "{{ home_dir }}/.bashrc"
      register: sym

    - name: Remove .bashrc if it's not a symlink
      file:
        path: "{{ home_dir }}/.bashrc"
        state: absent
      when: sym.stat.islnk is defined and sym.stat.islnk == False

    - name: Run stow
      shell: "stow . --dir={{ home_dir }}/.dotfiles --target {{ home_dir }} --verbose=2"
      register: link_created
      changed_when: 'link_created.stderr is search("LINK: ")'

# Uninstall dotfiles
- name: Remove dotfiles
  when: workstation.state == 'absent' and workstation.remove_user_data
  block:
    - name: Unstow dotfiles
      ansible.builtin.shell: "stow -D . --dir={{ home_dir }}/.dotfiles --target {{ home_dir }} --verbose=2"
      register: link_removed
      changed_when: 'link_removed.stderr is search("UNLINK: ")'
      failed_when: false

    - name: Remove dotfiles checkout
      ansible.builtin.file:
        path: "{{ home_dir }}/.dotfiles"
        state: absent

    - name: Check for a .bashrc after unstowing
      ansible.builtin.stat:
        path: "{{ home_dir }}/.bashrc"
      register: bashrc

    - name: Restore the default .bashrc
      ansible.builtin.copy:
        src: /etc/skel/.bashrc
        dest: "{{ home_dir }}/.bashrc"
        owner: "{{ local_user }}"
        group: "{{ local_user }}"
        mode: '0644'
        remote_src: true
      when: not bashrc.stat.exists
